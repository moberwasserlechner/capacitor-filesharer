name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      options:
        - label: I read the README and searched existing issues.
          required: true
        - label: I can reproduce this with a supported Capacitor and plugin version.
          required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Android, iOS, Web, Multiple platforms]
    validations:
      required: true
  - type: input
    id: capacitor-version
    attributes:
      label: Capacitor version
      placeholder: 8.4.1
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: 8.0.0
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the smallest code sample and deterministic steps that reproduce the problem. Do not include private file contents.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
