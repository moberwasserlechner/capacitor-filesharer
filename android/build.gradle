plugins {
    id 'com.android.library' version '8.13.1'
    id 'org.jetbrains.kotlin.android' version '2.0.21'
}

android {
    namespace 'com.byteowls.capacitor.filesharer'
    compileSdk project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36

    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()
        }
    }
}

dependencies {
    implementation project(':capacitor-android')
    implementation 'androidx.appcompat:appcompat:1.7.1'

    testImplementation 'org.json:json:20250517'
    testImplementation "org.junit.jupiter:junit-jupiter-api:${junit6Version}"
    testImplementation "org.junit.jupiter:junit-jupiter-params:${junit6Version}"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${junit6Version}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:${junit6Version}"
}
